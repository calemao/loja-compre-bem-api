spring.application.name=comprebem
server.port=8080

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/db-api;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=update

# Formato estável da página: { "content": [...], "page": { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via_dto
